spring:
  application:
    name: wallet-api
  jackson:
    deserialization:
      accept-float-as-int: false  # 1.5 must be rejected, not silently truncated to 1
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    open-in-view: false          # no lazy loading in the web layer; transactions belong to the service layer
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only verifies the mapping matches it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      operation-timeout: 5s   # a hung broker must not stall start-up for 40 s (measured 43 s with defaults)
      close-timeout: 2s
    producer:
      acks: all                      # an ack means the broker has the record; no loss on leader change
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true     # a retry inside one producer session cannot duplicate
        max.block.ms: 5000           # default 60 s would freeze the relay thread per call when the broker is down
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000   # must be >= request.timeout.ms + linger.ms
        linger.ms: 0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness and /readiness

server:
  shutdown: graceful

app:
  outbox:
    topic: wallet.transaction-completed.v1
    relay:
      batch-size: 100
      send-timeout-ms: 12000         # bounded wait per record, a little above delivery.timeout.ms
  jwt:
    secret: ${JWT_SECRET}        # no default on purpose: the app must not start without it
    access-token-minutes: 15
