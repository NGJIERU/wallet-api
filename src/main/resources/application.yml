spring:
  application:
    name: wallet-api
  jackson:
    deserialization:
      accept-float-as-int: false  # 1.5 must be rejected, not silently truncated to 1
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    open-in-view: false          # no lazy loading in the web layer; transactions belong to the service layer
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only verifies the mapping matches it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false           # JPA and Redis coexist: no Spring Data repository scanning for Redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      operation-timeout: 5s   # a hung broker must not stall start-up for 40 s (measured 43 s with defaults)
      close-timeout: 2s
    consumer:
      group-id: ${app.notifications.consumer-group}
      enable-auto-commit: false      # offsets are committed by the container after the handler (and its DB commit) returns
      auto-offset-reset: earliest    # a new group reads the whole topic; dedupe makes that safe
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false
    producer:
      acks: all                      # an ack means the broker has the record; no loss on leader change
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true     # a retry inside one producer session cannot duplicate
        max.block.ms: 5000           # default 60 s would freeze the relay thread per call when the broker is down
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000   # must be >= request.timeout.ms + linger.ms
        linger.ms: 0

management:
  health:
    redis:
      enabled: false             # Redis is not part of health: the limiter fails open, so an outage must not turn health DOWN
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness and /readiness

server:
  shutdown: graceful

app:
  ratelimit:
    enabled: false                 # on in Compose (APP_RATELIMIT_ENABLED) and in the limiter HTTP tests; limits default in code
  notifications:
    consumer-group: wallet-notifications   # also the Kafka group.id and the processed_events key
    consumer:
      enabled: true                  # off in tests (AbstractIntegrationTest)
    retry:
      attempts: 4                    # total attempts for a retryable failure
      initial-backoff: 500ms
      multiplier: 2.0
  outbox:
    topic: wallet.transaction-completed.v1
    relay:
      enabled: true                  # off in tests (AbstractIntegrationTest); on in the app
      batch-size: 100
      poll-interval: 500ms           # wait when idle; a full batch runs again immediately
      backoff-min: 1s                # after a failure: doubles up to backoff-max
      backoff-max: 30s
      send-timeout-ms: 12000         # bounded wait per record, a little above delivery.timeout.ms
  jwt:
    secret: ${JWT_SECRET}        # no default on purpose: the app must not start without it
    access-token-minutes: 15
